/* detectVerticalSquash & drawImageIOSFix = are functions that are critical due to a flaw in the iPhone camera software that squishes any photos displayed on an HTML5 canvas element. https://github.com/stomita/ios-imagefile-megapixel
*/
 function detectVerticalSquash(img) {
  
  var iw = img.naturalWidth, ih = img.naturalHeight; /* Image width and height. */
  
  var canvas = document.createElement('canvas');  /* Creates temporary canvas. */
  canvas.width = 1;
  canvas.height = ih;
  
  var ctx = canvas.getContext('2d'); /* Get drawing context. */
 
  ctx.drawImage(img, 0, 0); /* Draw image into temporary canvas. */
  
  var data = ctx.getImageData(0, 0, 1, ih).data; /* Get pixel data. */
  
  var sy = 0;  /* Initialize variables for binary search. */
  var ey = ih;
  var py = ih;
  
  while (py > sy) {  /* Binary search to detect squash ratio. */
   var alpha = data[(py - 1) * 4 + 3];
   
   if (alpha === 0) {
    ey = py;
   } else {
    sy = py;
   }
   
   py = (ey + sy) >> 1;
  }
  
  var ratio = (py / ih); /* Calculate squash ratio. */
  return (ratio===0)?1:ratio;  /* Default to 1 if invalid. */
 }

 function drawImageIOSFix(ctx, img, sx, sy, sw, sh, dx, dy, dw, dh) { /* Draw image while correcting squash bug */
  
  var vertSquashRatio = detectVerticalSquash(img); /* Get squash correction ratio. */
  
  ctx.drawImage(img, sx, sy, sw, sh, dx, dy, dw, dh / vertSquashRatio); /* Draw corrected image. */
 }
